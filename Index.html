<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Api</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>Google Maps Direction Finder</header>
    <gmpx-api-loader key="API-KEY" libraries="places"></gmpx-api-loader>

    <div class="controls">
        <gmpx-place-autocomplete id="origin" placeholder="Enter starting location"></gmpx-place-autocomplete>
    <gmpx-place-autocomplete id="destination" placeholder="Enter destination"></gmpx-place-autocomplete>
        <button onclick="calculateRoute()"> Get Direction</button>
    </div>
    <div id="map"></div>
    <script src="https://maps.googleapis.com/maps/api/js?key=API-KEY&libraries=places"></script>
    <script src="Script.js"></script>
    
</body>
</html>
